<section id="rank">
  <h2 class="sr-title">랭킹 · 전적 검색</h2>
  <div class="seg rank-seg" role="tablist" aria-label="전적 메뉴"><a href="#rank" class="on" aria-selected="true">랭킹·전적</a><a href="#friends" aria-selected="false">친구</a><a href="#power" aria-selected="false">덱파워</a></div>
  <div class="seg" id="rk-seg" role="group" aria-label="보기">
    <button type="button" data-v="board" class="on" aria-pressed="true">한국 랭킹</button>
    <button type="button" data-v="search" aria-pressed="false">전적 검색</button>
  </div>
  <div id="rk-board">
    <div class="mt-upd" id="rk-upd"><span id="rk-note"></span><button type="button" id="rk-upd-btn" hidden>새로고침</button></div>
    <div class="tiles rk-cut" id="rk-cut"></div>
    <div class="rk-head-row" aria-hidden="true"><span>순위</span><span>소환사</span><span>승률</span><span>순방률</span></div>
    <div class="rk-rows" id="rk-rows"><p class="sub">불러오는 중</p></div>
    <button type="button" class="tb-clear rk-more" id="rk-more">50명 더 보기</button>
  </div>
  <div id="rk-search" hidden>
    <div class="rk-sbox">
      <span class="rk-reg">KR</span>
      <input id="rk-q" type="search" placeholder="소환사 이름#태그" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="소환사 검색">
      <button type="button" id="rk-go" aria-label="검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
    </div>
    <div id="rk-sug"></div>
    <div id="rk-prof"></div>
  </div>
</section>
