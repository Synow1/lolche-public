<section id="units">
  <h2 class="sr-title">챔피언 통계</h2>
  <div class="seg deck-seg" role="tablist" aria-label="덱 메뉴"><a href="#meta" aria-selected="false">덱</a><a href="#tfa" aria-selected="false">아카데미</a><a href="#units" class="on" aria-selected="true">챔피언</a><a href="#parts" aria-selected="false">재료</a><a href="#emb" aria-selected="false">상징</a></div>
  <div class="mt-upd" id="un-upd"><span id="un-upd-t"></span><button type="button" id="un-upd-btn" hidden>새로고침</button></div>
  <div class="un-bar">
    <div class="mt-chips" id="un-cost" role="group" aria-label="코스트 거르기">
      <button type="button" data-c="0" class="on">전체</button>
      <button type="button" data-c="1">1코</button>
      <button type="button" data-c="2">2코</button>
      <button type="button" data-c="3">3코</button>
      <button type="button" data-c="4">4코</button>
      <button type="button" data-c="5">5코</button>
      <button type="button" data-c="7">7코</button>
      <button type="button" data-c="unl">해금</button>
    </div>
    <div class="un-tools">
      <input id="un-q" type="search" placeholder="챔피언·시너지 검색" autocomplete="off" aria-label="챔피언 통계 검색">
      <select id="un-sort" aria-label="정렬">
        <option value="avg">평균 등수순</option>
        <option value="win">승률순</option>
        <option value="top4">순방순</option>
        <option value="freq">빈도순</option>
        <option value="cost">코스트순</option>
      </select>
    </div>
  </div>
  <div class="un-head" aria-hidden="true"><span>챔피언</span><span>평균</span><span>순방</span><span>승률</span><span>빈도</span><span>인기 템</span></div>
  <div class="un-rows" id="un-rows"><p class="empty">불러오는 중</p></div>
  <p class="fnote" id="un-note"></p>
